        :root {

    --warning: #ffa726;
    --danger: #ff5252;

}

        * {
            margin: 0;

            box-sizing: border-box;
        }

    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;

/* 液态背景光效 */
body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
        radial-gradient(ellipse 600px 400px at 20% 30%, rgba(79, 172, 254, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 80% 70%, rgba(67, 233, 123, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 400px 300px at 60% 20%, rgba(168, 85, 247, 0.05) 0%, transparent 70%);
    animation: liquidBg 20s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
}
@keyframes liquidBg {
    0% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(2%, -1%) rotate(1deg); }
    66% { transform: translate(-1%, 2%) rotate(-0.5deg); }
    100% { transform: translate(1%, -2%) rotate(0.5deg); }
}

/* ========== 应收工具专用样式（补充进项核查CSS未覆盖的部分）========== */

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
}

/* Header */
.header {
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
}

.header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(79,172,254,0.5), transparent);
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-size: 22px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
}

.subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
}

/* Upload Section */
.card {
    background: rgba(30,41,59,0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(148,163,184,0.1);
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

.upload-zone {
    border: 2px dashed rgba(148,163,184,0.3);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    transition: all 0.3s;
    cursor: pointer;
    background: rgba(15,23,42,0.4);
}

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>✅ 应收账款分析工具</h1>

        <!-- Upload Section -->
        <div id="uploadSection" class="card">
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" class="upload-input" accept=".xlsx,.xls,.csv">

                    <div class="upload-icon">📊</div>

                    📥 导出全部(18个Sheet)

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-line1">© 2026 应收账款分析工具 · 开发者：张洪杰</div>
        <div class="footer-line2">版权所有 · 未经授权禁止复制、传播或商业使用 · 侵权必究</div>

    <script>
        // ==================== Global State ====================
        let rawData = [];
        let parsedData = [];
        let cutoffDate = null;
        let employeeData = {};
        let activeTab = 0;

        // Column mapping configuration
        const columnMapping = {
            sequence: ['序号', 'NO', '编号', '#'],
            print: ['打印'],
            firstReview: ['一审'],
            invoiceType: ['票据类型', '发票类型'],
            lineCount: ['行数'],
            docDate: ['单据日期', '日期', '开单日期', '出库日期'],
            select: ['选择'],
            docNo: ['单据号码', '单号', '单据编号'],
            orderNo: ['销售订单号', '订单号'],
            customer: ['客户', '客户名称', '客户名', '购货单位'],
            salesAmount: ['销售金额', '金额', '出库金额', '价税合计'],
            settled: ['已结算', '已收款', '结算金额'],
            unsettled: ['未结算', '未收款', '应收金额'],
            paymentAccount: ['收款帐户', '收款账户', '账户'],
            salesperson: ['业务员', '销售员', '经手人', '销售负责人'],
            remark: ['单据备注', '备注', '摘要'],
            createTime: ['制单时间', '创建时间'],
            creator: ['制单人', '创建人'],
            feeSummary: ['费用摘要'],
            feeAmount: ['费用金额']
        };

        // ==================== Utility Functions ====================
        function formatNumber(num, decimals = 2) {
            if (num === null || num === undefined || isNaN(num)) return '-';
            return Number(num).toLocaleString('zh-CN', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        function formatCurrency(num) {
            return formatNumber(num);
        }

        function parseDate(str) {
            if (!str) return null;
            if (str instanceof Date) return str;
            
            const formats = [
                /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/,
                /^(\d{4})(\d{2})(\d{2})$/,
                /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
            ];

            for (const fmt of formats) {
                const match = String(str).match(fmt);
                if (match) {
                    let year, month, day;
                    if (match[1].length === 4) {
                        year = parseInt(match[1]);
                        month = parseInt(match[2]);
                        day = parseInt(match[3]);
                    } else {
                        year = parseInt(match[3]);
                        month = parseInt(match[1]);
                        day = parseInt(match[2]);
                    }
                    const date = new Date(year, month - 1, day);
                    if (!isNaN(date.getTime())) return date;
                }
            }

            const date = new Date(str);
            return isNaN(date.getTime()) ? null : date;
        }

        function daysBetween(date1, date2) {
            const oneDay = 24 * 60 * 60 * 1000;
            return Math.round((date2 - date1) / oneDay);
        }

        function getAgeGroup(days) {
            if (days <= 30) return { name: '0-30天', level: 'normal', order: 1 };
            if (days <= 90) return { name: '31-90天', level: 'warning', order: 2 };
            if (days <= 180) return { name: '91-180天', level: 'danger', order: 3 };
            return { name: '180天以上', level: 'danger180', order: 4 };
        }

        function matchColumn(headers, targetColumns) {
            for (const col of targetColumns) {
                const idx = headers.findIndex(h => 
                    String(h).trim().toLowerCase() === col.toLowerCase()
                );
                if (idx !== -1) return idx;
            }
            return -1;
        }

        function findColumnIndex(headers, fieldName) {
            return matchColumn(headers, columnMapping[fieldName] || [fieldName]);
        }

        // ==================== File Parsing ====================
        function parseFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                    if (jsonData.length < 3) {
                        alert('文件数据行数不足');
                        return;
                    }

                    rawData = jsonData;
                    parseHeadersAndData();
                } catch (err) {
                    console.error('Parse error:', err);
                    alert('文件解析失败: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function parseHeadersAndData() {
            // Smart header detection: find the row that contains key column names
            const keyCols = ['客户', '销售金额', '未结算', '业务员'];
            let headerRowIndex = 0;
            for (let i = 0; i < Math.min(rawData.length, 10); i++) {
                const rowText = rawData[i] ? rawData[i].map(h => String(h).trim()).join('') : '';
                let matchCount = 0;
                for (const kc of keyCols) {
                    if (rowText.includes(kc)) matchCount++;
                }
                if (matchCount >= 2) {
                    headerRowIndex = i;
                    break;
                }
            }
            
            const headers = rawData[headerRowIndex].map(h => String(h).trim());
            console.log('Detected header at row', headerRowIndex, ':', headers.join(', '));
            
            const colIndices = {
                docDate: findColumnIndex(headers, 'docDate'),
                docNo: findColumnIndex(headers, 'docNo'),
                customer: findColumnIndex(headers, 'customer'),
                salesAmount: findColumnIndex(headers, 'salesAmount'),
                settled: findColumnIndex(headers, 'settled'),
                unsettled: findColumnIndex(headers, 'unsettled'),
                salesperson: findColumnIndex(headers, 'salesperson'),
                remark: findColumnIndex(headers, 'remark')
            };
            
            // Validate essential columns found
            if (colIndices.customer === -1 || colIndices.unsettled === -1) {
                alert('无法识别关键列（客户、未结算），请确认文件格式正确\n检测到的表头: ' + headers.join(', '));
                return;
            }

            // Parse cutoff date from rows before header
            for (let i = 0; i < headerRowIndex; i++) {
                const row = rawData[i];
                if (row && row.length > 0) {
                    const rowText = Array.isArray(row) ? row.filter(r => r != null).join(' ') : String(row);
                    const dateMatch = rowText.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/g);
                    if (dateMatch && dateMatch.length >= 2) {
                        const endDate = dateMatch[dateMatch.length - 1];
                        cutoffDate = parseDate(endDate);
                        if (cutoffDate) {
                            document.getElementById('cutoffDate').value = cutoffDate.toISOString().split('T')[0];
                            document.getElementById('dateInfo').textContent = `✓ 已从文件解析：${cutoffDate.toLocaleDateString()}`;
                        }
                        break;
                    }
                }
            }

            // Parse data rows (start after header row)
            parsedData = [];
            for (let i = headerRowIndex + 1; i < rawData.length; i++) {
                const row = rawData[i];
                if (!row || row.length === 0) continue;
                
                // Skip summary/total rows (合计, 总计, 小计 etc.)
                const rowText = row.map(c => String(c || '').trim()).join(' ');
                if (/合计|总计|小计|汇总/.test(rowText)) continue;

                const getVal = (idx) => {
                    if (idx < 0 || idx >= row.length) return '';
                    let val = row[idx];
                    if (typeof val === 'string') {
                        val = val.trim();
                        val = val.replace(/[￥¥,，]/g, '').trim();
                    }
                    return val;
                };

                const docDateStr = getVal(colIndices.docDate);
                const unsettledRaw = getVal(colIndices.unsettled);
                const salesAmount = parseFloat(getVal(colIndices.salesAmount)) || 0;
                const settled = parseFloat(getVal(colIndices.settled)) || 0;
                const unsettled = parseFloat(unsettledRaw) || 0;

                // Only include rows where unsettled has a value (non-empty)
                if (unsettledRaw === '' || unsettledRaw === null || unsettledRaw === undefined) continue;

                if (unsettled !== 0) {
                    const docDate = parseDate(docDateStr);
                    const age = docDate && cutoffDate ? daysBetween(docDate, cutoffDate) : null;
                    const ageGroup = age !== null ? getAgeGroup(age) : null;

                    parsedData.push({
                        docNo: getVal(colIndices.docNo),
                        docDate: docDate,
                        docDateStr: docDateStr,
                        customer: getVal(colIndices.customer) || '未指定',
                        salesAmount: salesAmount,
                        settled: settled,
                        unsettled: unsettled,
                        salesperson: getVal(colIndices.salesperson) || '未指定',
                        remark: getVal(colIndices.remark),
                        age: age,
                        ageGroup: ageGroup,
                        isReturn: salesAmount < 0
                    });
                }
            }

            if (parsedData.length === 0) {
                alert('未找到未结算记录');
                return;
            }

            groupBySalesperson();
            
            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('analysisSection').classList.remove('hidden');
            
            renderAnalysis();
        }

        function groupBySalesperson() {
            employeeData = {};
            
            for (const record of parsedData) {
                const emp = record.salesperson;
                if (!employeeData[emp]) {
                    employeeData[emp] = {
                        name: emp,
                        customers: {},
                        records: []
                    };
                }
                employeeData[emp].records.push(record);
                
                const cust = record.customer;
                if (!employeeData[emp].customers[cust]) {
                    employeeData[emp].customers[cust] = {
                        name: cust,
                        unsettled: 0,
                        records: [],
                        earliestDate: record.docDate,
                        latestDate: record.docDate
                    };
                }
                const custData = employeeData[emp].customers[cust];
                custData.records.push(record);
                custData.unsettled += record.unsettled;
                if (record.docDate < custData.earliestDate) custData.earliestDate = record.docDate;
                if (record.docDate > custData.latestDate) custData.latestDate = record.docDate;
            }
        }

        // ==================== Analysis Logic ====================
        function calculateStats() {
            const stats = {
                cutoffDate: cutoffDate,
                totalCustomers: new Set(parsedData.map(r => r.customer)).size,
                outboundCount: parsedData.filter(r => !r.isReturn).length,
                returnCount: parsedData.filter(r => r.isReturn).length,
                outboundAmount: parsedData.filter(r => !r.isReturn).reduce((s, r) => s + r.unsettled, 0),
                returnAmount: parsedData.filter(r => r.isReturn).reduce((s, r) => s + r.unsettled, 0),
                totalUnsettled: parsedData.reduce((s, r) => s + r.unsettled, 0),
                ageDistribution: {
                    normal: { count: 0, amount: 0 },
                    warning: { count: 0, amount: 0 },
                    danger: { count: 0, amount: 0 },
                    danger180: { count: 0, amount: 0 }
                },
                negativeAmountCustomers: 0,
                top10Percent: 0,
                top10Amount: 0,
                over90DaysAmount: 0,
                earliestDate: null
            };

            for (const record of parsedData) {
                if (record.ageGroup) {
                    if (record.ageGroup.level === 'normal') {
                        stats.ageDistribution.normal.count++;
                        stats.ageDistribution.normal.amount += record.unsettled;
                    } else if (record.ageGroup.level === 'warning') {
                        stats.ageDistribution.warning.count++;
                        stats.ageDistribution.warning.amount += record.unsettled;
                    } else if (record.ageGroup.level === 'danger') {
                        stats.ageDistribution.danger.count++;
                        stats.ageDistribution.danger.amount += record.unsettled;
                    } else if (record.ageGroup.level === 'danger180') {
                        stats.ageDistribution.danger180.count++;
                        stats.ageDistribution.danger180.amount += record.unsettled;
                    }
                }
                if (record.unsettled < 0) {
                    stats.negativeAmountCustomers++;
                }
                if (record.age !== null && record.age > 90) {
                    stats.over90DaysAmount += record.unsettled;
                }
                if (!stats.earliestDate || (record.docDate && record.docDate < stats.earliestDate)) {
                    stats.earliestDate = record.docDate;
                }
            }

            const customerTotals = {};
            for (const record of parsedData) {
                customerTotals[record.customer] = (customerTotals[record.customer] || 0) + record.unsettled;
            }
            const sortedCustomers = Object.entries(customerTotals)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
            
            const top10Total = sortedCustomers.reduce((s, [, v]) => s + v, 0);
            stats.top10Amount = top10Total;
            stats.top10Percent = stats.totalUnsettled !== 0 ? (top10Total / stats.totalUnsettled * 100) : 0;
            stats.over100kCustomers = Object.values(customerTotals).filter(v => v > 100000).length;

            return stats;
        }

        function getSalespersonStats() {
            const result = [];
            
            for (const [empName, empData] of Object.entries(employeeData)) {
                let totalUnsettled = 0;
                let normalAmount = 0, warningAmount = 0, dangerAmount = 0, danger180Amount = 0;

                for (const record of empData.records) {
                    totalUnsettled += record.unsettled;
                    if (record.ageGroup) {
                        if (record.ageGroup.level === 'normal') {
                            normalAmount += record.unsettled;
                        } else if (record.ageGroup.level === 'warning') {
                            warningAmount += record.unsettled;
                        } else if (record.ageGroup.level === 'danger') {
                            dangerAmount += record.unsettled;
                        } else if (record.ageGroup.level === 'danger180') {
                            danger180Amount += record.unsettled;
                        }
                    }
                }

                const urgentAmount = warningAmount + dangerAmount + danger180Amount;
                const over30DaysPercent = totalUnsettled !== 0 ? (urgentAmount / totalUnsettled * 100) : 0;

                result.push({
                    name: empName,
                    customerCount: Object.keys(empData.customers).length,
                    totalUnsettled,
                    normalAmount,
                    warningAmount,
                    dangerAmount,
                    danger180Amount,
                    urgentAmount,
                    over30DaysPercent
                });
            }

            return result.sort((a, b) => b.totalUnsettled - a.totalUnsettled);
        }

        function getCustomerDetails() {
            const customerTotals = {};
            
            for (const record of parsedData) {
                if (!customerTotals[record.customer]) {
                    customerTotals[record.customer] = {
                        name: record.customer,
                        unsettled: 0,
                        count: 0,
                        earliestDate: record.docDate,
                        latestDate: record.docDate,
                        salesperson: record.salesperson,
                        records: []
                    };
                }
                const c = customerTotals[record.customer];
                c.unsettled += record.unsettled;
                c.count++;
                c.records.push(record);
                if (record.docDate && record.docDate < c.earliestDate) c.earliestDate = record.docDate;
                if (record.docDate && record.docDate > c.latestDate) c.latestDate = record.docDate;
            }

            const result = Object.values(customerTotals).map(c => {
                const ageGroups = { normal: 0, warning: 0, danger: 0, danger180: 0 };
                for (const r of c.records) {
                    if (r.ageGroup) {
                        if (r.ageGroup.level === 'danger180') {
                            ageGroups.danger180++;
                        } else {
                            ageGroups[r.ageGroup.level]++;
                        }
                    }
                }
                let dominantGroup = 'normal';
                if (ageGroups.danger180 > 0) {
                    dominantGroup = 'danger180';
                } else if (ageGroups.danger > 0) {
                    dominantGroup = 'danger';
                } else if (ageGroups.warning > 0) {
                    dominantGroup = 'warning';
                }
                
                let ageRange = '未知';
                if (c.earliestDate && cutoffDate) {
                    const minAge = daysBetween(c.earliestDate, cutoffDate);
                    const ag = getAgeGroup(minAge);
                    ageRange = ag.name;
                }

                return {
                    name: c.name,
                    unsettled: c.unsettled,
                    count: c.count,
                    ageRange,
                    ageGroup: dominantGroup,
                    earliestDate: c.earliestDate,
                    latestDate: c.latestDate,
                    salesperson: c.salesperson
                };
            });

            return result.sort((a, b) => b.unsettled - a.unsettled);
        }

        async function exportToExcel(sheets, filename) {
            const workbook = new ExcelJS.Workbook();
            workbook.creator = '张洪杰';
            workbook.created = new Date();

            for (const sheet of sheets) {
                const ws = workbook.addWorksheet(sheet.title);
                await addSheetContent(ws, sheet.tabIdx);
            }

            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), filename);
        }

                ];

                for (const cfg of groupConfig) {
                    const items = groups[cfg.key];
                    if (!items || items.length === 0) continue;

                    const totalAmount = items.reduce((s, c) => s + c.unsettled, 0);

                    ws.addRow([`${cfg.label}｜ ${items.length}个客户 ｜ 未结算合计：${formatNumber(totalAmount)}元`]);

                ws.mergeCells('A1:H1');

                let totalUnsettled = 0;
                let normalAmount = 0, warningAmount = 0, dangerAmount = 0, danger180Amount = 0;
                const customerGroups = { normal: [], warning: [], danger: [], danger180: [] };

                for (const [custName, custData] of Object.entries(empData.customers)) {
                    totalUnsettled += custData.unsettled;
                    
                    let maxDanger = 0, maxWarning = 0, maxDanger180 = 0;
                    for (const r of custData.records) {
                        if (r.ageGroup) {
                            if (r.ageGroup.level === 'danger180') maxDanger180++;
                            else if (r.ageGroup.level === 'danger') maxDanger++;
                            else if (r.ageGroup.level === 'warning') maxWarning++;
                        }
                    }
                    
                    let group = 'normal';
                    if (maxDanger180 > 0) {
                        group = 'danger180';
                        danger180Amount += custData.unsettled;
                    } else if (maxDanger > 0) {
                        group = 'danger';
                        dangerAmount += custData.unsettled;
                    } else if (maxWarning > 0) {
                        group = 'warning';
                        warningAmount += custData.unsettled;
                    } else {
                        normalAmount += custData.unsettled;
                    }

                    customerGroups[group].push({
                        name: custName,
                        unsettled: custData.unsettled,
                        count: custData.records.length,
                        earliestDate: custData.earliestDate,
                        latestDate: custData.latestDate
                    });

                    { key: 'danger180', label: '180天以上（紧急）', style: styles.danger180Red, urgency: '紧急', level: '180天以上' }
                ];

                for (const cfg of groupConfig) {
                    const items = customerGroups[cfg.key];
                    if (!items || items.length === 0) continue;

                    const groupTotal = items.reduce((s, c) => s + c.unsettled, 0);

                    ws.addRow([`${cfg.label}｜ ${items.length}个客户 ｜ 金额合计：${formatNumber(groupTotal)}元`]);
                    ws.getCell(`A${ws.rowCount}`).font = { bold: true };
                    ws.mergeCells(`A${ws.rowCount}:H${ws.rowCount}`);

                    ws.addRow(['序号', '客户名称', '未结算金额', '单据数', '账龄区间', '紧急程度', '最早单据日期', '最近单据日期']);
                    const headerRow = ws.rowCount;
                    for (let col = 1; col <= 8; col++) {
                        applyCellStyle(ws.getCell(`${String.fromCharCode(64 + col)}${headerRow}`), styles.headerBlue);
                    }

                    rowNum = ws.rowCount + 1;
                    items.forEach((c, i) => {
                        ws.addRow([
                            i + 1, c.name, c.unsettled, c.count, cfg.level, cfg.urgency,
                            c.earliestDate ? c.earliestDate.toLocaleDateString('zh-CN') : '-',
                            c.latestDate ? c.latestDate.toLocaleDateString('zh-CN') : '-'
                        ]);
                        for (let col = 1; col <= 8; col++) {
                            const cell = ws.getCell(`${String.fromCharCode(64 + col)}${rowNum}`);
                            if (col === 3) {
                                applyCellStyle(cell, styles.numberCell);
                            } else {
                                applyCellStyle(cell, styles.normalCell);
                            }
                        }
                        rowNum++;
                    });

                    // 小计行
                    ws.addRow(['', '小计', groupTotal, items.length, cfg.level, cfg.urgency, '', '']);
                    for (let col = 1; col <= 8; col++) {
                        applyCellStyle(ws.getCell(`${String.fromCharCode(64 + col)}${rowNum}`), styles.subtotalRow);
                    }

                    ws.addRow([]);
                }

                // 总计行
                rowNum = ws.rowCount + 1;
                ws.addRow(['', '总计', totalUnsettled, Object.keys(empData.customers).length, '', '', '', '']);
                for (let col = 1; col <= 8; col++) {
                    applyCellStyle(ws.getCell(`${String.fromCharCode(64 + col)}${rowNum}`), styles.totalRow);
                }

                ws.columns.forEach(col => col.width = 16);
                ws.getColumn(2).width = 40;
            }
        }

        // ==================== Event Handlers ====================
        document.addEventListener('DOMContentLoaded', function() {
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const cutoffDateInput = document.getElementById('cutoffDate');

            uploadZone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    parseFile(e.target.files[0]);
                }
            });

            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadZone.classList.add('dragover');
            });

            uploadZone.addEventListener('dragleave', () => {
                uploadZone.classList.remove('dragover');
            });

            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    parseFile(e.dataTransfer.files[0]);
                }
            });

            cutoffDateInput.addEventListener('change', function() {
                if (this.value) {
                    cutoffDate = new Date(this.value);
                    cutoffDate.setHours(23, 59, 59, 999);
                    document.getElementById('dateInfo').textContent = `✓ 手动设置：${cutoffDate.toLocaleDateString()}`;
                    if (parsedData.length > 0) {
                        for (const record of parsedData) {
                            if (record.docDate) {
                                record.age = daysBetween(record.docDate, cutoffDate);
                                record.ageGroup = getAgeGroup(record.age);
                            }
                        }
                        groupBySalesperson();
                        renderAnalysis();
                    }
                }
            });

            document.getElementById('exportCurrentBtn').addEventListener('click', exportCurrentTab);
            document.getElementById('exportAllBtn').addEventListener('click', exportAllTabs);
            document.getElementById('screenshotCurrentBtn').addEventListener('click', screenshotCurrentTab);

            const today = new Date();
            cutoffDateInput.value = today.toISOString().split('T')[0];
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('SW registration failed:', err);
                });
            });
        }

        // ==================== Screenshot Function ====================
        async function screenshotCurrentTab() {
            const tabContent = document.getElementById('tabContents');
            if (!tabContent) { alert('请先上传数据'); return; }
            
            const activeTabEl = document.querySelector('.tab-btn.active');
            const tabName = activeTabEl ? activeTabEl.textContent.trim() : '分析';
            
            try {
                const canvas = await html2canvas(tabContent, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    useCORS: true,
                    logging: false
                });
                const link = document.createElement('a');
                const dateStr = cutoffDate ? cutoffDate.toISOString().split('T')[0] : new Date().toISOString().split('T')[0];
                link.download = `应收分析_${tabName}_${dateStr}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('Screenshot error:', err);
                alert('截图失败: ' + err.message);
            }
        }

    </script>
</body>
</html>
